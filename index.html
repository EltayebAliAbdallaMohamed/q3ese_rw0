<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lesson Template</title>

<style>
  body {
    font-family: system-ui, Arial, sans-serif;
    margin: 0;
    padding: 16px;
    background: #f9f9f9;
  }

  .container {
    max-width: 700px;
    margin: auto;
  }

  .card {
    background: white;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 15px;
    box-shadow: 0 2px 6px rgba(0,0,0,0.08);
  }

  .text-box {
    font-size: 20px;
    margin: 12px 0;
  }

  #arabic {
    direction: rtl;
    text-align: right;
    font-size: 22px;
  }

  details summary {
    font-weight: bold;
    font-size: 18px;
    cursor: pointer;
  }

  button {
    font-size: 18px;
    padding: 14px;
    border-radius: 10px;
    border: none;
    background: #007bff;
    color: white;
  }

  button:disabled {
    background: #ccc;
  }

  input[type="range"] {
    width: 100%;
  }

  ul {
    padding-left: 18px;
  }

  li {
    margin-bottom: 8px;
  }
</style>
</head>

<body>

<div class="container">

<h2>Q Skills Intro RW</h2>
<p id="progress"></p>

<div class="card">

  <details>
    <summary>Show Arabic</summary>
    <p id="arabic" class="text-box"></p>
  </details>

  <details>
    <summary>Show English</summary>
    <p id="english" class="text-box"></p>
  </details>

</div>

<div class="card">
  <h3>Questions</h3>
  <ul id="questions"></ul>
</div>

<div class="card">
  <label>
    <input type="checkbox" id="autoSpeak">
    Auto-play
  </label>
</div>

<div class="card">
  <label>Speed: <span id="rateValue">1</span></label>
  <input type="range" id="rateSlider" min="0.2" max="1.5" step="0.1" value="1">
</div>

<div class="card">
  <button onclick="speak(current.ar)">🔊 Arabic</button>
  <button onclick="speak(current.en)">🔊 English</button>
</div>

<!-- ✅ ADDED STOP BUTTON ONLY -->
<div class="card">
  <button onclick="stopSpeech()">⏹ Stop</button>
</div>

<div class="card">
  <button id="prevBtn" onclick="prev()">Previous</button>
  <button id="nextBtn" onclick="next()">Next</button>
</div>

</div>

<footer style="text-align:center; font-size:14px; color:#555; margin-top:20px;">
  <p>&copy; 2026 Developed by: Eltayeb Mohamed</p>
</footer>

<script>
let lesson1 = [];
let index = 0;
let current = {};
let voices = [];
let speechRate = 1;

// slider
rateSlider.oninput = () => {
  speechRate = parseFloat(rateSlider.value);
  rateValue.textContent = speechRate;
};

// voices
speechSynthesis.onvoiceschanged = () => {
  voices = speechSynthesis.getVoices();
};

// load JSON
let file = "lesson1.json";

fetch(file)
  .then(r => r.json())
  .then(j => {
    lesson1 = j;
    show();
  });

// show lesson
function show() {
  current = lesson1[index];

  arabic.textContent = current.ar;
  english.textContent = current.en;
  progress.textContent = (index+1) + " / " + lesson1.length;

  renderQuestions();

  prevBtn.disabled = index === 0;
  nextBtn.disabled = index === lesson1.length - 1;

  if (autoSpeak.checked) speakSequence();
}

// QUESTIONS
function renderQuestions() {
  const list = document.getElementById("questions");
  list.innerHTML = "";

  if (!current.questions || current.questions.length === 0) {
    list.innerHTML = "<li>No questions available</li>";
    return;
  }

  current.questions.forEach(q => {
    const li = document.createElement("li");
    li.textContent = q;
    list.appendChild(li);
  });
}

// speak
function speak(text) {
  speechSynthesis.cancel();

  const msg = new SpeechSynthesisUtterance(text);

  const isArabic = /[\u0600-\u06FF]/.test(text);

  msg.lang = isArabic ? "ar-SA" : "en-US";

  const voice = voices.find(v => v.lang.startsWith(isArabic ? "ar" : "en"));
  if (voice) msg.voice = voice;

  msg.rate = speechRate;
  msg.pitch = isArabic ? 0.8 : 1;

  speechSynthesis.speak(msg);
}

// sequence
function speakSequence() {
  speechSynthesis.cancel();

  const ar = new SpeechSynthesisUtterance(current.ar);
  const en = new SpeechSynthesisUtterance(current.en);

  const arVoice = voices.find(v => v.lang.startsWith("ar"));
  const enVoice = voices.find(v => v.lang.startsWith("en"));

  if (arVoice) ar.voice = arVoice;
  if (enVoice) en.voice = enVoice;

  ar.lang = "ar-SA";
  en.lang = "en-US";

  ar.rate = speechRate;
  en.rate = speechRate;

  ar.onend = () => setTimeout(() => speechSynthesis.speak(en), 300);

  speechSynthesis.speak(ar);
}

/* ✅ ADDED FUNCTION ONLY */
function stopSpeech() {
  speechSynthesis.cancel();
}

// nav
function next() {
  if (index < lesson1.length - 1) {
    index++;
    show();
  }
}

function prev() {
  if (index > 0) {
    index--;
    show();
  }
}
</script>

</body>
</html>
